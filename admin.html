<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olive & Ember | Reservations</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f5f0;
        color: #25291f;
      }
      .panel {
        background: white;
        border: 1px solid #e9e5dc;
        border-radius: 16px;
      }
      .field {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd8ce;
        border-radius: 9px;
        background: white;
        outline: none;
      }
      .field:focus {
        border-color: #68734b;
        box-shadow: 0 0 0 2px #68734b20;
      }
    </style>
  </head>

  <body>
    <header class="bg-[#25291f] text-white px-5 py-5">
      <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
        <div>
          <p class="text-xs tracking-[0.25em] uppercase text-[#d5c8a6]">
            Olive & Ember
          </p>
          <h1 class="text-2xl font-bold mt-1">Reservation Dashboard</h1>
        </div>
        <span class="text-sm text-[#d5c8a6]">Restaurant Admin</span>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-5 md:p-8">
      <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
        <div>
          <h2 class="text-xl font-bold">All Reservations</h2>
          <p class="text-sm text-gray-500 mt-1">
            View, search and manage customer bookings.
          </p>
        </div>
        <button
          id="refreshBtn"
          class="bg-[#68734b] text-white px-5 py-3 rounded-lg font-semibold"
        >
          Refresh bookings
        </button>
      </div>

      <p id="message" role="status" class="text-sm mb-4"></p>

      <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="panel p-5">
          <p class="text-gray-500 text-sm">Total bookings</p>
          <p id="totalCount" class="text-3xl font-bold mt-2">—</p>
        </div>
        <div class="panel p-5">
          <p class="text-gray-500 text-sm">Pending bookings</p>
          <p id="pendingCount" class="text-3xl font-bold mt-2">—</p>
        </div>
        <div class="panel p-5">
          <p class="text-gray-500 text-sm">Confirmed bookings</p>
          <p id="confirmedCount" class="text-3xl font-bold mt-2">—</p>
        </div>
      </section>

      <section class="panel p-5 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="search" class="block text-sm font-semibold mb-2">
              Search by name or phone
            </label>
            <input
              id="search"
              class="field"
              placeholder="Enter customer name or phone number"
            />
          </div>

          <div>
            <label for="statusFilter" class="block text-sm font-semibold mb-2">
              Filter by status
            </label>
            <select id="statusFilter" class="field">
              <option value="all">All reservations</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
      </section>

      <section id="bookingList" class="space-y-4">
        <div class="panel p-6 text-gray-500">Loading bookings...</div>
      </section>

      <p class="text-xs text-gray-500 mt-6">
        Temporary prototype: do not publish this page with public read/delete
        permissions enabled.
      </p>
    </main>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // Replace both values with your own Supabase project details.
      const SUPABASE_URL = "https://aekjuckxxiholzuayzig.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_nhhqo9NzsDLG5Bg2mNILdg_4uP2M0Rc";

      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const bookingList = document.getElementById("bookingList");
      const message = document.getElementById("message");
      const searchInput = document.getElementById("search");
      const statusFilter = document.getElementById("statusFilter");

      let bookings = [];

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError
          ? "text-sm mb-4 text-red-700"
          : "text-sm mb-4 text-[#52643a]";
      }

      function safeText(value) {
        return value === null || value === undefined || value === ""
          ? "Not provided"
          : String(value);
      }

      function makeElement(tag, className, text) {
        const el = document.createElement(tag);
        el.className = className;
        el.textContent = text;
        return el;
      }

      function updateCounts() {
        document.getElementById("totalCount").textContent = bookings.length;
        document.getElementById("pendingCount").textContent = bookings.filter(
          (b) => b.status === "pending",
        ).length;
        document.getElementById("confirmedCount").textContent = bookings.filter(
          (b) => b.status === "confirmed",
        ).length;
      }

      async function loadBookings() {
        showMessage("Loading reservations...");
        bookingList.replaceChildren(
          makeElement("div", "panel p-6 text-gray-500", "Loading bookings..."),
        );

        const { data, error } = await supabase
          .from("reservations")
          .select(
            "id, name, phone, booking_date, booking_time, guests, occasion, special_requests, status, created_at",
          )
          .order("created_at", { ascending: false })
          .limit(500);

        if (error) {
          bookings = [];
          updateCounts();
          bookingList.replaceChildren(
            makeElement(
              "div",
              "panel p-6 text-red-700",
              "Could not load bookings: " + error.message,
            ),
          );
          showMessage(
            "Check your Supabase URL, key, table and policies.",
            true,
          );
          return;
        }

        bookings = data || [];
        updateCounts();
        renderBookings();
        showMessage(`Loaded ${bookings.length} reservation(s).`);
      }

      function renderBookings() {
        const query = searchInput.value.trim().toLowerCase();
        const selectedStatus = statusFilter.value;

        const filtered = bookings.filter((booking) => {
          const matchesSearch =
            String(booking.name || "")
              .toLowerCase()
              .includes(query) ||
            String(booking.phone || "")
              .toLowerCase()
              .includes(query);

          const matchesStatus =
            selectedStatus === "all" || booking.status === selectedStatus;

          return matchesSearch && matchesStatus;
        });

        bookingList.replaceChildren();

        if (filtered.length === 0) {
          bookingList.append(
            makeElement(
              "div",
              "panel p-8 text-gray-500",
              "No reservations match your search.",
            ),
          );
          return;
        }

        filtered.forEach((booking) => {
          const card = document.createElement("article");
          card.className = "panel p-5 md:p-6";

          const top = document.createElement("div");
          top.className =
            "flex flex-wrap justify-between items-start gap-3 mb-4";

          const identity = document.createElement("div");
          identity.append(
            makeElement("h3", "text-lg font-bold", safeText(booking.name)),
            makeElement(
              "p",
              "text-sm text-gray-500 mt-1",
              "Phone: " + safeText(booking.phone),
            ),
          );

          const status = String(booking.status || "pending");
          const statusBadge = makeElement(
            "span",
            "text-xs font-bold uppercase tracking-wide px-3 py-2 rounded-full " +
              (status === "confirmed"
                ? "bg-green-100 text-green-800"
                : status === "cancelled"
                  ? "bg-red-100 text-red-800"
                  : "bg-amber-100 text-amber-800"),
            status,
          );

          top.append(identity, statusBadge);
          card.append(top);

          const details = document.createElement("div");
          details.className =
            "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-sm";

          const items = [
            ["Booking date", booking.booking_date],
            ["Booking time", booking.booking_time],
            ["Guests", booking.guests],
            ["Occasion", booking.occasion],
            ["Special requests", booking.special_requests],
            [
              "Created at",
              booking.created_at
                ? new Date(booking.created_at).toLocaleString()
                : null,
            ],
          ];

          items.forEach(([label, value]) => {
            const item = document.createElement("div");
            item.append(
              makeElement("p", "text-gray-500 mb-1", label),
              makeElement(
                "p",
                "font-medium whitespace-pre-wrap break-words",
                safeText(value),
              ),
            );
            details.append(item);
          });

          card.append(details);

          const actions = document.createElement("div");
          actions.className =
            "flex justify-end mt-5 pt-4 border-t border-gray-100";

          const deleteButton = makeElement(
            "button",
            "bg-red-50 text-red-700 hover:bg-red-100 px-4 py-2 rounded-lg font-semibold text-sm",
            "Delete booking",
          );

          deleteButton.type = "button";
          deleteButton.addEventListener("click", () => deleteBooking(booking));

          actions.append(deleteButton);
          card.append(actions);
          bookingList.append(card);
        });
      }

      async function deleteBooking(booking) {
        const confirmed = window.confirm(
          `Delete the reservation for ${booking.name || "this customer"}? This cannot be undone.`,
        );

        if (!confirmed) return;

        showMessage("Deleting reservation...");

        const { data, error } = await supabase
          .from("reservations")
          .delete()
          .eq("id", booking.id)
          .select("id");

        if (error) {
          showMessage("Delete failed: " + error.message, true);
          return;
        }

        if (!data || data.length === 0) {
          showMessage(
            "No booking was deleted. Check the table's delete permissions.",
            true,
          );
          return;
        }

        showMessage("Reservation deleted successfully.");
        await loadBookings();
      }

      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadBookings);

      searchInput.addEventListener("input", renderBookings);
      statusFilter.addEventListener("change", renderBookings);

      if (
        SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        showMessage(
          "First add your Supabase project URL and publishable key in admin.html.",
          true,
        );
        bookingList.replaceChildren(
          makeElement(
            "div",
            "panel p-6 text-gray-600",
            "Waiting for Supabase configuration.",
          ),
        );
      } else {
        loadBookings();
      }
    </script>
  </body>
</html>
